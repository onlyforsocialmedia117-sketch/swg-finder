<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SWG Dimension Finder</title>
<style>
:root[data-theme="light"]{--page:#eceaf3;--bg:#fff;--ink:#17112b;--mute:#7d7791;--acc:#7a1fd6;--acc2:#4b13a0;--track:#ece6fb;--line:#d9d3ea;--sheet:#fff;--wind:#cdbcf3;--windline:#7a1fd6}
:root[data-theme="dark"]{--page:#05040a;--bg:#0a0914;--ink:#f3f0ff;--mute:#9a94b3;--acc:#a15cff;--acc2:#6c2bd9;--track:#241c3d;--line:#2e2548;--sheet:#14102a;--wind:#3a2c63;--windline:#a15cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:430px;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:500px){body{padding:20px 0}.app{min-height:min(860px,calc(100vh - 40px));border-radius:30px;box-shadow:0 12px 50px rgba(40,10,90,.25)}}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--track);color:var(--acc);font-size:17px;cursor:pointer;display:grid;place-items:center}
.chip{align-self:center;margin-top:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:600}
.chip i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--acc);border-right-color:var(--track);display:inline-block}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 6px}
svg{width:100%;height:auto;max-height:62vh;display:block}
svg text{font-family:"Segoe UI",system-ui,Arial,sans-serif}
.cap{font-size:10px;fill:var(--mute);font-weight:600}
.val{font-size:14px;font-weight:800;fill:var(--ink);font-variant-numeric:tabular-nums}
.dim{transition:opacity .2s}
.bar{display:flex;justify-content:space-around;padding:10px 12px 26px}
.fb{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.fb span{width:66px;height:66px;border-radius:50%;background:var(--track);color:var(--acc);display:grid;place-items:center;font-size:17px;font-weight:800;transition:transform .12s}
.fb:active span{transform:scale(.93)}
.fb.on span{background:var(--acc);color:#fff}
.veil{position:absolute;inset:0;background:rgba(10,5,25,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:26px 26px 0 0;padding:10px 18px 28px;transform:translateY(105%);transition:transform .25s ease;z-index:6;max-height:70%;overflow:auto}
.sheet.show{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:15px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.opts button{padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.opts button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.opts.two{grid-template-columns:1fr 1fr}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;font-size:14px}
.set input{width:84px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;text-align:right}
</style></head><body>
<div class="app">
 <header>
  <button class="ib" id="gear" aria-label="Ring clearance settings">⚙</button>
  <h1>SWG Dimension Finder</h1>
  <button class="ib" id="theme" aria-label="Toggle theme">☾</button>
 </header>
 <div class="chip"><i></i><span id="chipTxt"></span></div>
 <div class="stage"><svg id="dwg" viewBox="0 0 400 300" role="img" aria-label="Gasket drawing with dimensions"></svg></div>
 <div class="bar">
  <button class="fb" data-k="size"><span id="b-size"></span>Size</button>
  <button class="fb" data-k="series"><span id="b-series"></span>Series</button>
  <button class="fb" data-k="rating"><span id="b-rating"></span>Rating</button>
  <button class="fb" data-k="part"><span id="b-part"></span>Part</button>
 </div>
 <div class="veil" id="veil"></div>
 <div class="sheet" id="sheet"><div class="grab"></div><h3 id="sTitle"></h3><div id="sBody"></div></div>
</div>

const $=id=>document.getElementById(id);
const num=s=>s.split(' ').reduce((t,x)=>t+(x.includes('/')?x.split('/')[0]/x.split('/')[1]:+x),0);
const uniq=a=>[...new Set(a)];
const f=v=>(Math.round(v*10)/10).toFixed(1);
const S={size:'2',series:'Std',rating:'150',part:'all'};
const C={ir:2.5,or:3}; // inner ring OD = GID + ir ; outer ring ID = GOD - or
const PARTS=[['all','All'],['winding','Winding'],['inner','Inner ring'],['outer','Outer ring']];
const PSHORT={all:'All',winding:'Wind.',inner:'Inner',outer:'Outer'};

function opts(k){
  if(k==='size')return uniq(D.map(r=>r[0])).sort((a,b)=>num(a)-num(b)).map(v=>[v,v+'"']);
  if(k==='series')return uniq(D.filter(r=>r[0]===S.size).map(r=>r[1])).map(v=>[v,v==='Std'?'Std':'Series '+v]);
  if(k==='rating')return uniq(D.filter(r=>r[0]===S.size&&r[1]===S.series).map(r=>r[2])).sort((a,b)=>a-b).map(v=>[v,v]);
  return PARTS;
}
function fix(){
  const s=opts('series').map(o=>o[0]); if(!s.includes(S.series))S.series=s[0];
  const c=opts('rating').map(o=>o[0]); if(!c.includes(S.rating))S.rating=c[0];
}
const sv=document.documentElement;
function band(r1,r2,col,op){const w=Math.max(r2-r1,1.6);return `<circle cx="200" cy="150" r="${(r1+(r1+w))/2}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`}
function render(){
  fix();
  const r=D.find(x=>x[0]===S.size&&x[1]===S.series&&x[2]===S.rating);
  const [,,,OROD,GOD,GID,IRID]=r, irOD=GID+C.ir, orID=GOD-C.or;
  $('b-size').textContent=S.size+'"'; $('b-size').style.fontSize=S.size.length>3?'13px':'17px';
  $('b-series').textContent=S.series; $('b-rating').textContent=S.rating; $('b-part').textContent=PSHORT[S.part]; $('b-part').style.fontSize='14px';
  $('chipTxt').textContent=`${S.size}" · ${S.series==='Std'?'Standard':'Series '+S.series} · Class ${S.rating}`;
  const rMin=48,rMax=101,k=(rMax-rMin)/(OROD-IRID),R=d=>rMin+(d-IRID)*k;
  const on=p=>S.part==='all'||S.part===p, op=p=>on(p)?1:.18;
  let g='';
  g+=`<circle cx="200" cy="150" r="${rMax+6}" fill="none" stroke="var(--track)" stroke-width="1.5"/>`;
  g+=band(R(GID),R(GOD),'var(--wind)',op('winding'));
  g+=`<circle cx="200" cy="150" r="${(R(GID)+R(GOD))/2}" fill="none" stroke="var(--windline)" stroke-width="${Math.max(R(GOD)-R(GID)-1.5,1)}" stroke-dasharray="1.2 2.6" opacity="${op('winding')*.75}"/>`;
  g+=band(R(IRID),R(irOD),'var(--acc2)',op('inner'));
  g+=band(R(orID),R(OROD),'var(--acc)',op('outer'));
  // centre text
  g+=`<text x="200" y="${150}" text-anchor="middle" font-size="${S.size.length>3?18:24}" font-weight="800" fill="var(--ink)">${S.size}"</text>`;
  g+=`<text x="200" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="var(--mute)">Class ${S.rating}</text>`;
  // callouts: [caption, value, radius, angle, side, labelY, part]
  const L=[['Outer ring OD',OROD,R(OROD),-45,1,80,'outer'],['Gasket OD',GOD,R(GOD),0,1,150,'winding'],['Outer ring ID',orID,R(orID),45,1,220,'outer'],
          ['Inner ring OD',irOD,R(irOD),-135,-1,80,'inner'],['Inner ring ID',IRID,R(IRID),180,-1,150,'inner'],['Gasket ID',GID,R(GID),135,-1,220,'winding']];

    const a=ang*Math.PI/180,px=200+rad*Math.cos(a),py=150+rad*Math.sin(a),ex=200+sd*113;
    g+=`<g class="dim" opacity="${op(p)}"><circle cx="${px}" cy="${py}" r="2.4" fill="var(--ink)"/>
     <polyline points="${px},${py} ${ex},${ly} ${ex+sd*5},${ly}" fill="none" stroke="var(--ink)" stroke-width="1" opacity=".6"/>

  });
  g+=`<text x="200" y="292" text-anchor="middle" font-size="9" fill="var(--mute)">Schematic – not to scale · dimensions in mm</text>`;
  $('dwg').innerHTML=g;
}
let cur=null;
function openSheet(k){
  cur=k;const T={size:'Select size',series:'Select series',rating:'Select rating (class)',part:'Select part'};
  $('sTitle').textContent=T[k];
  $('sBody').innerHTML='<div class="opts'+(k==='part'?' two':'')+'">'+opts(k).map(o=>`<button data-v="${o[0]}" class="${S[k]===o[0]?'sel':''}">${o[1]}</button>`).join('')+'</div>';

}
function show(){$('sheet').classList.add('show');$('veil').classList.add('show')}
function hide(){$('sheet').classList.remove('show');$('veil').classList.remove('show')}
document.querySelectorAll('.fb').forEach(b=>b.onclick=()=>openSheet(b.dataset.k));

$('veil').onclick=hide;
document.onkeydown=e=>{if(e.key==='Escape')hide()};
$('gear').onclick=()=>{
  cur=null;$('sTitle').textContent='Ring clearance (mm)';
  $('sBody').innerHTML=`<div class="set"><span>Inner ring OD = Gasket ID +</span><input id="cIr" type="number" step="0.1" value="${C.ir}"></div>
